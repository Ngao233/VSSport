<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    section{display: grid;
    grid-template-columns: repeat(2,1fr);
    width: 80%;
    margin-left: 10%;
    gap: 10px;
    grid-template-columns: 49% 49%;
    grid-template-rows: 500px;
    margin-right: 10%;
}
    section div{
        background-color: blue;

    }
    header{
    display: flex;
    flex-direction: column;
    font-family:'Poppins', sans-serif;
}

/* menu chinh */
.menu-two {
    background-color: #FFA031;
    display: flex;
    flex-direction: Row;
    justify-content: space-between;
    height: 50px;
    text-decoration: none;
    
}
.menu-two ul{
    font-weight: bold;
    font-size: 14px;
    padding: 0;
    display: flex;
    flex-direction: Row;
    color: white !important;
    text-decoration: none;
}
.menu-two ul li{
    list-style-type: none;
    margin-right: 70px;
    letter-spacing: 2px;
    color: white;
    text-align: center;
}
.menu-two ul li a{
    color: white;
    text-decoration: none;
    
}
.menu-two img{
    margin-left: 25px;
}
/* menu phu */
.menu-one ul{
    margin: inherit;
    justify-content: space-between;
    font-size: 12px;
    display: flex;
    flex-direction: Row;
    color: white !important;

}
.menu-one{
    background-color: #5c3911;
}
.menu-one ul div{
    display: flex;
    flex-direction: Row;
    
}
.menu-one ul li {
    list-style-type: none;
    margin-right: 20px;
    letter-spacing: 2px;
}
.menu-one ul li a{
    color: white;
    text-decoration: none;
}
/* Icon */
.icon{
    display: flex;
    flex-direction: row;
    align-items: Center;
    margin-right: 25px;
}
.icon a {
    color: white;
    margin-right: 20px;
}
.button {  
    background-color: #FFA031;  
    color: white;  
    padding: 10px 15px;  
    border: none;  
    border-radius: 5px;  
    cursor: pointer;  
    text-align: center;  
    display: block;  
    width: 40%;  
    font-size: 16px;  
    margin: 25px; 
    display: inline-block;
}  
.product-info h2{
    text-align: left;
    font-size: 24px;
}
.price{
    font-weight: none;font-size: 16px;color:#FFA031;
}
.e{background-color: #FFA031;  
    color: white;  
    padding: 5px 10px;  
    border: none;  
    border-radius: 5px;  
    cursor: pointer;  
    text-align: center;  
    display: block;  
    width: 10%;  
    font-size: 16px;  
    margin: 5px; 
    display: inline-block;}
    .h img{
        margin-left: 10px;
        border: 1px solid;  
    }
    .size-options label{
        font-size: 20px;
    }
</style>
</head>
<body>
    <header>
    <!-- menu phu -->
      <nav class="menu-one">

<br>
    <section>
        <div>

        </div>

               var imgArr = [];
                var curIndex = 0;
                
                function loadImgs(){
                  for (let i=0; i<=4; i++ ){
                    imgArr[i] = new Image();
                    imgArr[i].src = "img/pic-" + i + ".jpg";

                }
                function showimage(i){

                }

                  <br>
                    <button value="S"class=e>S</button>  
                    <button value="M"class=e>M</button>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 3 Menu Example</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.js"></script>
    <style>
        .menu {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            background-color: #f1f1f1;
        }
        .menu li {
            padding: 10px;
            cursor: pointer;
        }
        .menu li a {
            text-decoration: none;
            color: #333;
        }
        .menu li:hover {
            color: #4CAF50;
        }
        .content {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <nav-menu :items="menuItems" @select="currentView = $event"></nav-menu>
        <div class="content">
            <component :is="currentView"></component>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        const Home = {
            template: `<div><h2>Home</h2><p>Welcome to the home page!</p></div>`
        }

        const About = {
            template: `<div><h2>About</h2><p>This is the about page.</p></div>`
        }

        const Services = {
            template: `<div><h2>Services</h2><p>Here are our services.</p></div>`
        }

        const Contact = {
            template: `<div><h2>Contact</h2><p>Contact us here.</p></div>`
        }

        const NavMenu = {
            props: ['items'],
            template: `
                <ul class="menu">
                    <li v-for="item in items" :key="item.id" @click="$emit('select', item.component)">
                        {{ item.text }}
                    </li>
                </ul>
            `
        }

        createApp({
            components: {
                NavMenu,
                Home,
                About,
                Services,
                Contact
            },
            data() {
                return {
                    menuItems: [
                        { id: 1, text: 'Home', component: 'Home' },
                        { id: 2, text: 'About', component: 'About' },
                        { id: 3, text: 'Services', component: 'Services' },
                        { id: 4, text: 'Contact', component: 'Contact' }
                    ],
                    currentView: 'Home'
                }
            }
        }).mount('#app')
    </script>
</body>
</html>

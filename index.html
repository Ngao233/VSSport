<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="san">
      <div class="sanpham">
        <div class="sanpham1">
          <div class="product-page">
            <section class="product-detail">
              <div class="product-image">
                <img src="hinh\image.png" alt="Product Image">
                <div class="thumbnail-gallery">
                  <img src="hinh\image.png" alt="Thumbnail 1">
                  <img src="hinh\image.png" alt="Thumbnail 2">
                  <img src="hinh\image.png" alt="Thumbnail 3">
                </div>
              </div>
              <div class="product-info">
                <h1>Áo Thun Phối Thể Thao Simpson Local Brand Streetwear Form Oversize - TS10</h1>
                <p class="price">110.000 đ</p>
                <p>Màu sắc:</p>
                <div class="color-options">
                  <span class="color black"></span>
                  <span class="color gray"></span>
                  <span class="color red"></span>
                  <span class="color white"></span>
                </div>
                <div class="rating">
                  ★★★☆☆
                </div>
                <div>
                  <h4></h4>
                </div>
                <button class="add-to-cart">Thêm giỏ hàng</button>
                <button class="buy-now">Mua Ngay</button>
              </div>
            </section>
        </div>

      </div>
    </div>
    </section>
</body>
</html>

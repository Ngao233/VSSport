<!DOCTYPE html>  
<html lang="vi">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>In Sản Phẩm</title>  
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins&family=Montserrat&family=Raleway&family=Lato&family=Rubik&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Roboto&family=Nunito&family=Source+Sans+Pro&family=Josefin+Sans&display=swap"
        rel="stylesheet">
     
</head>  
<body>  
    <section>
        <div class="sp-in">
            <div class="image">
                <img src="image.png" alt="">
                <div class="text-nhan" id="textN">

                </div>
                <div class="number-nhan" id="numberN">

                </div>
            </div>
            <div class="form">
                <h2 class="tensp" id="tensp">Manchester City
                    Away Jersey 2024/25</h2>
                <h3>Giá sản phẩm</h3>
                <p>271.000 đ</p>
                <h3>Nhập tên và nhập số áo bạn muốn</h3>
                <input onchange="Textaction()" type="text" id="nametext" placeholder="Nhập tên vào đây">
                <input onchange="Numberr()" type="number" id="numbertext" placeholder="Nhập số vào đây">
                <h3>Chọn kích thước</h3>
                <label class="kichco"><input type="radio" name="size" value="S">
                    <div>S</div>
                </label>
                <label class="kichco"><input type="radio" name="size" value="M">
                    <div>M</div>
                </label>
                <label class="kichco"><input type="radio" name="size" value="L">
                    <div>L</div>
                </label>
                <label class="kichco"><input type="radio" name="size" value="XL">
                    <div>XL</div>
                </label>
                <label class="kichco"><input type="radio" name="size" value="XLL">
                    <div>XLL</div>
                </label> <br><br><br><br><br>
                <h3>Lưu ý</h3>
                <p>Món hàng không hoàn trả</p>
                <p>Giao hàng từ 3 - 5 ngày</p>
                <div>
                    <button class="tgh">Thêm giỏ hàng</button>
                </div>
            </div>
            
    </section>
    <script src="javascrip.js">

    </script>
</body>  
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSSport</title>
  <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Roboto&family=Nunito&family=Source+Sans+Pro&family=Josefin+Sans&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="style2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link
        href="https://fonts.googleapis.com/css2?family=Poppins&family=Montserrat&family=Raleway&family=Lato&family=Rubik&display=swap"
        rel="stylesheet">
</head>
<body>
  <header>
  <!-- menu phu -->
    <nav class="menu-one">
      <ul>
        <li>VSSport.vn</li>
            <div>
            <li>Giúp đỡ</li>
            <li>Ngôn ngữ</li>
            </div>
      </ul>
    </nav>
    <!-- menu chinh -->
    <nav class="menu-two">
        <img src="VSSport (5).png" alt="" style="width: 155px ;">
      <ul>
        <li>TRANG CHỦ</li>
        <li>SẢN PHẨM</li>
        <li>THÔNG TIN</li>
        <li>ĐĂNG KÝ</li>
        <li>ĐĂNG NHẬP</li>
      </ul>
      <!-- icon bao gom "shoping" "user" "seach" -->
      <div class="icon">
        <a href=""><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="#"><i class="fa-solid fa-user"></i></a>
        <a href=""><i class="fa-solid fa-magnifying-glass"></i></a>
      </div>

    </nav>
    <section class="banner">
      <div class="slides" id="slides">
          <div class="slide"><img src="../image/banner1.png" alt="Hình ảnh 1"></div>
          <div class="slide"><img src="../image/banner2.png" alt="Hình ảnh 2"></div>
    </section>
  </header>

  <script>
    let currentIndex = 0;
    const slides = document.getElementById('slides');
    const totalSlides = slides.children.length;

    function showNextSlide() {
        currentIndex = (currentIndex + 1) % totalSlides;
        slides.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    setInterval(showNextSlide, 3000); 
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Bar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    .search-container {
      position: relative;
      width: 50%;
      margin: auto;
    }
    .search-input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .search-results {
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      max-height: 200px;
      overflow-y: auto;
    }
    .search-results div {
      padding: 10px;
      cursor: pointer;
    }
    .search-results div:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>Search Bar Example</h1>
  <div class="search-container">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Type to search..."
      oninput="search()"
    />
    <div id="results" class="search-results"></div>
  </div>

  <script>
    const data = ["Apple", "Banana", "Cherry", "Date", "Grapes", "Mango", "Orange", "Pineapple", "Strawberry"];

    function search() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const results = document.getElementById("results");
      results.innerHTML = "";

      if (input) {
        const filteredData = data.filter(item => item.toLowerCase().includes(input));
        filteredData.forEach(item => {
          const div = document.createElement("div");
          div.textContent = item;
          div.onclick = () => alert(`You selected: ${item}`);
          results.appendChild(div);
        });
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Tùy chỉnh sidebar */
    #sidebar {
      background-color: #ffa031;
      color: white;
      min-height: 100vh;
    }

    #sidebar .nav-link {
      color: #ffffff;
    }

    #sidebar .nav-link:hover {
      background-color: #ffa031;
      color: white;
    }

    #sidebar .nav-link.active {
      background-color: #ffa031;
      color: white;
    }

    /* Tùy chỉnh stats card */
    .card {
      border-radius: 8px;
      overflow: hidden;
    }

    .card-header {
      font-weight: bold;
    }

    .card-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Tùy chỉnh table */
    .table-responsive {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    /* Box shadow cho card */
    .card.shadow {
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
    }
    .text-center-mt-3{
      font-size: 40px;
      text-align: center;
    }
    img{
      width: 200px;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <div class="container-fluid">
    <div class="row">
     
      <!-- Sidebar -->
      <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar">

        <div class="position-sticky pt-3">
          <img src="VSSp rt.png" alt="" >
          <ul class="nav flex-column mt-4">
            <li class="nav-item">
              <a class="nav-link active" href="admin.html">
                <span data-feather="home"></span>
                Home
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">
                <span data-feather="file"></span>
                Quản lý sản phẩm
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">
                <span data-feather="shopping-cart"></span>
                Đơn hàng
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="users.html">
                <span data-feather="users"></span>
                Người dùng
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="statistics.html">
                <span data-feather="bar-chart-2"></span>
                Thống kê
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="settings.html">
                <span data-feather="settings"></span>
                Cài đặt
              </a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Main content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div
          class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2">Dashboard</h1>
          <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary">Thêm mới</button>
          </div>
        </div>

        <!-- Dashboard stats -->
       

        <!-- Data Table with Search Bar -->
        <h2 class="mb-3">Danh sách sản phẩm</h2>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Tìm kiếm sản phẩm...">
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-sm">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Tên sản phẩm</th>
                <th>Danh mục</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Sản phẩm A</td>
                <td>Danh mục 1</td>
                <td>$100</td>
                <td>50</td>
                <td><span class="badge bg-success">Đang bán</span></td>
                <td>
                  <button class="btn btn-sm btn-warning">Sửa</button>
                  <button class="btn btn-sm btn-danger">Xóa</button>
                </td>
              </tr>
              <tr>
                <td>2</td>
                <td>Sản phẩm B</td>
                <td>Danh mục 2</td>
                <td>$150</td>
                <td>20</td>
                <td><span class="badge bg-secondary">Hết hàng</span></td>
                <td>
                  <button class="btn btn-sm btn-warning">Sửa</button>
                  <button class="btn btn-sm btn-danger">Xóa</button>
                </td>
              </tr>
              <!-- Thêm sản phẩm tùy ý -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script>
    feather.replace()
  </script>
</body>

</html>

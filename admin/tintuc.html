<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="../public/css/styleAdmin.css">
      <link
      href="https://fonts.googleapis.com/css2?family=Poppins&family=Montserrat&family=Raleway&family=Lato&family=Rubik&display=swap"
      rel="stylesheet">
  </style>
</head>

<body>

  <div class="container-fluid">  
    <div class="row">  
      <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar">  
        <div class="position-sticky pt-3">  
          <img src="../image/logo.png" alt="Logo">  
          <ul class="nav flex-column mt-4">  
            <li class="nav-item">  
              <a class="nav-link active" href="admin.html">  
                <i data-feather="home"></i> Home  
              </a>  
            </li>  
            <li class="nav-item">  
              <a class="nav-link" href="products.html">  
                <i data-feather="box"></i> Quản lý sản phẩm  
              </a>  
            </li>  
            <li class="nav-item">  
              <a class="nav-link" href="orders.html">  
                <i data-feather="shopping-cart"></i> Đơn hàng  
              </a>  
            </li>  
            <li class="nav-item">  
              <a class="nav-link" href="users.html">  
                <i data-feather="users"></i> Người dùng  
              </a>  
            </li>  
            <li class="nav-item">  
              <a class="nav-link" href="statistics.html">  
                <i data-feather="bar-chart-2"></i> Thống kê  
              </a>  
            </li>  
            <li class="nav-item">  
              <a class="nav-link" href="settings.html">  
                <i data-feather="settings"></i> Cài đặt  
              </a>  
            </li>  
          </ul>  
        </div>  
      </nav>

      <!-- Main content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div
          class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2">Dashboard</h1>
          <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary">Thêm mới</button>
          </div>
        </div>

        <!-- Data Table with Search Bar -->
        <h2 class="mb-3">Danh sách tin tức</h2>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Tìm kiếm sản phẩm...">
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-sm">
            <thead class="table-dark">
              <tr>
                <th>ID bài viết</th>
                <th>Tiêu đề</th>
                <th>Danh mục</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Bảng tin 1</td>
                <td>Danh mục 1</td>
                <td>
                  <button class="btn btn-sm btn-warning">Sửa</button>
                  <button class="btn btn-sm btn-danger">Xóa</button>
                </td>
              </tr>
              <tr>
                <td>2</td>
                <td>Bảng tin 2</td>
                <td>Danh mục 2</td>
                <td>
                  <button class="btn btn-sm btn-warning">Sửa</button>
                  <button class="btn btn-sm btn-danger">Xóa</button>
                </td>
              </tr>
              <!-- Thêm sản phẩm tùy ý -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script>
    feather.replace()
  </script>
</body>

</html>

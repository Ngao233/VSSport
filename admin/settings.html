                  <ul class="nav flex-column mt-4">

                      <a class="nav-link active" href="admin.html">  
                        <i data-feather="home"></i> Home  
                      </a>  
                    </li>  
                    <li class="nav-item">  
                      <a class="nav-link" href="products.html">

                    </li>  
                    <li class="nav-item">  
                      <a class="nav-link" href="orders.html">

                    <li class="nav-item">  
                      <a class="nav-link" href="users.html">

                    </li>

                      <a class="nav-link" href="settings.html">

                      </a>  
                    </li>  
                  </ul>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">

                    <h1 class="h2">Cài Đặt</h1>
                </div>

                <form>
                    <div class="mb-3">
                        <label for="siteName" class="form-label">Tên website</label>
                        <input type="text" class="form-control" id="siteName" placeholder="Nhập tên website">
                    </div>
                    <div class="mb-3">
                        <label for="adminEmail" class="form-label">Email quản trị</label>
                        <input type="email" class="form-control" id="adminEmail" placeholder="Nhập email quản trị">
                    </div>
                    <div class="mb-3">
                        <label for="adminPassword" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="adminPassword" placeholder="Nhập mật khẩu">
                    </div>
                    <button type="submit" class="btn btn-primary">Lưu cài đặt</button>
                </form>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
